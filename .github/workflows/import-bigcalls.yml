name: import-bigcalls

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract BIGCALLS source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/bigcalls-extract
          mkdir -p /tmp/bigcalls-extract
          unzip -q botsolana2-main.zip -d /tmp/bigcalls-extract

          SRC="$(find /tmp/bigcalls-extract -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          if [ -z "$SRC" ]; then
            SRC=/tmp/bigcalls-extract
          fi

          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a "$SRC"/. .

          rm -f botsolana2-main.zip
          rm -rf target data admin-panel node_modules
          find . -type d -name node_modules -prune -exec rm -rf {} + || true
          find . -type d -name target -prune -exec rm -rf {} + || true
          find . -type f \( -name '*.keypair' -o -name '*.seed' -o -name '*.secret' \) -delete

          rm -f .github/workflows/import-bigcalls.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: initialize BIGCALLS MVP"
          git push
